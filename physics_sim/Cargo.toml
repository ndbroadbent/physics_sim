[package]
name = "physics_sim"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "physics_sim"
path = "src/main.rs"

[[bin]]
name = "physics_gpu"
path = "src/main_gpu.rs"

[[bin]]
name = "physics_genetic"
path = "src/main_genetic.rs"

[[bin]]
name = "visualize_genome"
path = "src/main_visualize_genome.rs"

[[bin]]
name = "verify_geometry"
path = "src/verify_geometry.rs"

[[bin]]
name = "slice_render"
path = "src/slice_render.rs"

[[bin]]
name = "physics_genetic_v2"
path = "src/main_genetic_v2.rs"

[[bin]]
name = "physics_genetic_v3"
path = "src/main_genetic_v3.rs"

[[bin]]
name = "physics_wave"
path = "src/main_wave.rs"

[[bin]]
name = "logic_evolution"
path = "src/main_logic_evolution.rs"

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
env_logger = "0.11.8"
image = "0.25.9"
log = "0.4.28"
plotters = "0.3.7"
pollster = "0.4.0"
rand = "0.9.2"
wgpu = "27.0.1"
winit = "0.30.12"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
