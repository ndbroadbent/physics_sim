[package]
name = "physics_sim"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "physics_sim"
path = "src/main.rs"

[[bin]]
name = "physics_gpu"
path = "src/main_gpu.rs"

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
env_logger = "0.11.8"
image = "0.25.9"
log = "0.4.28"
plotters = "0.3.7"
pollster = "0.4.0"
rand = "0.9.2"
wgpu = "27.0.1"
winit = "0.30.12"
tokio = { version = "1", features = ["full"] }
